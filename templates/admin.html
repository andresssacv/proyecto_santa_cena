<!DOCTYPE html>
 <html lang="es">
 <head>
 <meta charset="UTF-8">
 <title>Registros Santa Cena</title>
 <meta name="viewport" content="width=device-width, initial-scale=1">
 
 <style>
 body { font-family: Arial; background:#f4f6f8; padding:20px; }
 .container { max-width:1000px; margin:auto; background:white; padding:20px; border-radius:12px; }
 table { width:100%; border-collapse:collapse; margin-top:15px; }
 td, th { padding:8px; border-bottom:1px solid #ddd; }
 button { padding:6px 10px; border:none; border-radius:6px; cursor:pointer; }
 .delete { background:red; color:white; }
 .reset { background:orange; color:white; }
 .hidden { display:none; }
 </style>
 </head>
 
 <body>
 <script>
 const token = localStorage.getItem('accessToken');
 if (!token) {
   window.location.href = '/login';
 }
 </script>


<div class="container">
  <h2 id="titulo">Mis registros — Santa Cena</h2>

  <button id="btnReset" class="reset hidden" onclick="resetAll()">Reset Total</button>

  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Fila</th>
        <th>Sector</th>
        <th>Fecha</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody id="tabla"></tbody>
  </table>
</div>

 <script>
 let isAdmin = false;
 
 function getAuthHeaders() {
   const accessToken = localStorage.getItem('accessToken');
   if (!accessToken) {
     throw new Error('Debes iniciar sesión.');
   }
   return {
     "Content-Type": "application/json",
     "Authorization": `Bearer ${accessToken}`
   };
 }
 
 async function parseResponse(res) {
   const contentType = res.headers.get('content-type') || '';
   if (contentType.includes('application/json')) {
     return await res.json();
   }
   return { message: (await res.text()) || `HTTP ${res.status}` };
 }
 
async function cargar() {
  const res = await fetch('/registros/listar', { headers: getAuthHeaders() });
  const payload = await parseResponse(res);
 
if (!res.ok) {
    if (res.status === 401) {
      localStorage.removeItem('accessToken');
      localStorage.removeItem('refreshToken');
      window.location.href = '/login';
      return;
     }
    throw new Error(payload?.message || `Error al cargar admin (HTTP ${res.status})`);
  }

  const rows = Array.isArray(payload?.rows) ? payload.rows : [];
  isAdmin = !!payload?.is_admin;

  document.getElementById('titulo').textContent = isAdmin
    ? 'Todos los registros — Santa Cena'
    : 'Mis registros — Santa Cena';

  const btnReset = document.getElementById('btnReset');
  btnReset.classList.toggle('hidden', !isAdmin);

  const tabla = document.getElementById("tabla");
  tabla.innerHTML = "";

  rows.forEach(r => {
    const tr = document.createElement("tr");
    const botonBorrar = isAdmin
      ? `<button class="delete" onclick="borrar('${r.id}')">Borrar</button>`
      : '';

    tr.innerHTML = `
      <td>${r.nombre ?? ''}</td>
      <td>${r.fila ?? ''}</td>
      <td>${r.sector ?? ''}</td>
      <td>${r.created_at ? new Date(r.created_at).toLocaleString() : ''}</td>
      <td>${botonBorrar}</td>
    `;
    tabla.appendChild(tr);
  });
}
 
async function borrar(id) {
  if (!confirm('¿Eliminar registro?')) return;

  const res = await fetch('/admin/borrar', {
    method: 'POST',
    headers: getAuthHeaders(),
    body: JSON.stringify({ id })
  });

  const data = await parseResponse(res);
  if (!res.ok) {
    throw new Error(data?.message || `No se pudo borrar (HTTP ${res.status})`);
   }


  await cargar();
}

async function resetAll() {
  if (!isAdmin) {
     alert('Solo administrador puede hacer reset total.');
     return;

  }
  if (!confirm('¿RESET TOTAL?')) return;

  const res = await fetch("/admin/reset", { method:"POST", headers: getAuthHeaders() });
  const data = await parseResponse(res);
  if (!res.ok) {
    throw new Error(data?.message || `No se pudo resetear (HTTP ${res.status})`);
  }

  await cargar();
}

cargar().catch((e) => alert(e.message));
</script>
 
</body>
</html>
