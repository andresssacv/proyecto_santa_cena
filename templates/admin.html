 <!DOCTYPE html>
 <html lang="es">
 <head>
 <meta charset="UTF-8">
 <title>Admin Santa Cena</title>
 <meta name="viewport" content="width=device-width, initial-scale=1">
 
 <style>
 body { font-family: Arial; background:#f4f6f8; padding:20px; }
 .container { max-width:1000px; margin:auto; background:white; padding:20px; border-radius:12px; }
 table { width:100%; border-collapse:collapse; margin-top:15px; }
 td, th { padding:8px; border-bottom:1px solid #ddd; }
 button { padding:6px 10px; border:none; border-radius:6px; cursor:pointer; }
 .delete { background:red; color:white; }
 .reset { background:orange; color:white; }
 </style>
 </head>
 
 <body>
<script>
const token = localStorage.getItem('accessToken');
if (!token) {
  window.location.href = '/login';
}
</script>
 
 <div class="container">
   <h2>Panel Admin — Registros Santa Cena</h2>
 
   <button class="reset" onclick="resetAll()">Reset Total</button>
 
   <table>
     <thead>
       <tr>
         <th>Nombre</th>
         <th>Fila</th>
         <th>Sector</th>
         <th>Fecha</th>
         <th>Acción</th>
       </tr>
     </thead>
     <tbody id="tabla"></tbody>
   </table>
 </div>
 
 <script>

function getAuthHeaders() {
  const accessToken = localStorage.getItem('accessToken');
  if (!accessToken) {
    throw new Error('Debes iniciar sesión como administrador.');
  }
  return {
    "Content-Type": "application/json",
    "Authorization": `Bearer ${accessToken}`
  };
}

 async function cargar() {
  const res = await fetch("/admin/listar", { headers: getAuthHeaders() });
   const data = await res.json();

  if (!res.ok) {
    if (res.status === 401) {
      localStorage.removeItem('accessToken');
      localStorage.removeItem('refreshToken');
      window.location.href = '/login';
      return;
    }
    throw new Error(data?.message || `Error al cargar admin (HTTP ${res.status})`);
  }

  if (!Array.isArray(data)) {
    throw new Error(data?.message || 'Respuesta inválida al listar registros.');
  }

   const tabla = document.getElementById("tabla");
   tabla.innerHTML = "";
 
   data.forEach(r => {
     const tr = document.createElement("tr");
     tr.innerHTML = `
       <td>${r.nombre}</td>
       <td>${r.fila}</td>
       <td>${r.sector}</td>
       <td>${new Date(r.created_at).toLocaleString()}</td>
       <td><button class="delete" onclick="borrar(${r.id})">Borrar</button></td>
     `;
     tabla.appendChild(tr);
   });
 }
 
 async function borrar(id) {
   if (!confirm("Eliminar registro?")) return;
 
  const res = await fetch("/admin/borrar", {
     method:"POST",
    headers:getAuthHeaders(),
     body:JSON.stringify({id})
   });
 
  const data = await res.json();
  if (!res.ok) {
    throw new Error(data?.message || `No se pudo borrar (HTTP ${res.status})`);
  }

  cargar().catch((e) => alert(e.message));
 }
 
 async function resetAll() {
   if (!confirm("RESET TOTAL?")) return;
 
  const res = await fetch("/admin/reset", { method:"POST", headers: getAuthHeaders() });
  const data = await res.json();
  if (!res.ok) {
    throw new Error(data?.message || `No se pudo resetear (HTTP ${res.status})`);
  }
 
  cargar().catch((e) => alert(e.message));
 }
 
cargar().catch((e) => alert(e.message));
 </script>
 
 </body>
 </html>
