<!DOCTYPE html>
 <html lang="es">
 <head>
 <meta charset="UTF-8">
 <title>Registros Santa Cena</title>
 <meta name="viewport" content="width=device-width, initial-scale=1">
 
 <style>
 body { font-family: Arial; background:#f4f6f8; padding:20px; }
 .container { max-width:1000px; margin:auto; background:white; padding:20px; border-radius:12px; }
 .table-wrap { overflow-x:auto; -webkit-overflow-scrolling: touch; }
 table { width:100%; border-collapse:collapse; margin-top:15px; min-width:560px; }
 td, th { padding:8px; border-bottom:1px solid #ddd; }
 button { padding:6px 10px; border:none; border-radius:6px; cursor:pointer; }
 .delete { background:red; color:white; }
 .reset { background:orange; color:white; margin-bottom:8px; }
 .hidden { display:none; }
  @media (max-width: 640px) {
   body { padding:10px; }
   .container { padding:12px; border-radius:10px; }
   h2 { font-size:18px; margin-top:0; }
   td, th { padding:6px; font-size:12px; }
   button { font-size:12px; }
   .reset { width:100%; }
 }
 </style>
 </head>
 
 <body>
 <script>
 const token = localStorage.getItem('accessToken');
 if (!token) {
   window.location.href = '/login';
 }
 </script>


<div class="container">
  <h2 id="titulo">Mis registros — Santa Cena</h2>

  <button id="btnReset" class="reset hidden" onclick="resetAll()">Reset Total</button>

  <div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Fila</th>
        <th>Sector</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody id="tabla"></tbody>
  </table>
</div>
</div>

 <script>
 let isAdmin = false;
 
 function getAuthHeaders() {
   const accessToken = localStorage.getItem('accessToken');
   if (!accessToken) {
     throw new Error('Debes iniciar sesión.');
   }
   return {
     "Content-Type": "application/json",
     "Authorization": `Bearer ${accessToken}`
   };
 }
 
 async function parseResponse(res) {
   const contentType = res.headers.get('content-type') || '';
   if (contentType.includes('application/json')) {
     return await res.json();
   }
   return { message: (await res.text()) || `HTTP ${res.status}` };
 }
 async function fetchWithTimeout(url, options = {}, timeoutMs = 15000) {
   const controller = new AbortController();
   const timeout = setTimeout(() => controller.abort(), timeoutMs);
   try {
     return await fetch(url, { ...options, signal: controller.signal });
   } finally {
     clearTimeout(timeout);
   }
 }

 window.fetchWithTimeout = fetchWithTimeout;
 
async function cargar() {
  const res = await (window.fetchWithTimeout || fetch)('/registros/listar', { headers: getAuthHeaders() });
  const payload = await parseResponse(res);
 
if (!res.ok) {
    if (res.status === 401) {
      localStorage.removeItem('accessToken');
      localStorage.removeItem('refreshToken');
      window.location.href = '/login';
      return;
     }
    throw new Error(payload?.message || `Error al cargar admin (HTTP ${res.status})`);
  }

  const rows = Array.isArray(payload?.rows) ? payload.rows : [];
  isAdmin = !!payload?.is_admin;

  document.getElementById('titulo').textContent = isAdmin
    ? 'Todos los registros — Santa Cena'
    : 'Mis registros — Santa Cena';

  const btnReset = document.getElementById('btnReset');
  btnReset.classList.toggle('hidden', !isAdmin);

  const tabla = document.getElementById("tabla");
  tabla.innerHTML = "";

  rows.forEach(r => {
    const tr = document.createElement("tr");
    const botonBorrar = `<button class="delete" onclick="borrar('${r.id}')">Borrar</button>`;

    tr.innerHTML = `
      <td>${r.nombre ?? ''}</td>
      <td>${r.fila ?? ''}</td>
      <td>${r.sector ?? ''}</td>
      <td>${botonBorrar}</td>
    `;
    tabla.appendChild(tr);
  });
}
 
async function borrar(id, btn = null) {
  if (!confirm('¿Eliminar registro?')) return;

  const endpoint = isAdmin ? '/admin/borrar' : '/registros/borrar';
  const originalText = btn?.textContent;
  if (btn) {
    btn.disabled = true;
    btn.textContent = 'Borrando...';
  }

  try {
    const res = await (window.fetchWithTimeout || fetch)(endpoint, {
      method: 'POST',
      headers: getAuthHeaders(),
      body: JSON.stringify({ id })
    });

    const data = await parseResponse(res);
    if (!res.ok) {
      if (res.status === 401) {
        localStorage.removeItem('accessToken');
        localStorage.removeItem('refreshToken');
        window.location.href = '/login';
        return;
      }
      throw new Error(data?.message || `No se pudo borrar (HTTP ${res.status})`);
    }

    await cargar();
  } catch (e) {
    if (e?.name === 'AbortError') {
      alert('La solicitud tardó demasiado. Inténtalo nuevamente.');
    } else {
      alert(e?.message || 'No se pudo borrar el registro.');
    }
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.textContent = originalText || 'Borrar';
    }
  }
}

async function resetAll() {
  if (!isAdmin) {
     alert('Solo administrador puede hacer reset total.');
     return;

}
  if (!confirm('¿RESET TOTAL?')) return;

  const res = await (window.fetchWithTimeout || fetch)("/admin/reset", { method:"POST", headers: getAuthHeaders() });
  const data = await parseResponse(res);
  if (!res.ok) {
    throw new Error(data?.message || `No se pudo resetear (HTTP ${res.status})`);
  }

  await cargar();
}

cargar().catch((e) => alert(e.message));
</script>
 
</body>
</html>
