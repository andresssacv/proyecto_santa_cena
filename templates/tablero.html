<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Registros</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Manrope', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-black text-slate-900">REGISTROS <span class="text-blue-600">HOY</span></h1>
            <a href="/" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-2 px-4 rounded-xl transition-all">
                ← VOLVER AL MAPA
            </a>
        </div>

        <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-900 text-white">
                        <th class="p-4 font-extrabold uppercase text-xs tracking-widest">Hermano</th>
                        <th class="p-4 font-extrabold uppercase text-xs tracking-widest">Fila</th>
                        <th class="p-4 font-extrabold uppercase text-xs tracking-widest text-center">Acción</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    {% for reg in registros %}
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="p-4 font-bold text-slate-700">{{ reg.Nombre }}</td>
                        <td class="p-4 font-black text-blue-600">Fila {{ reg.Fila }}</td>
                        <td class="p-4 text-center">
                            <button onclick="liberarFila('{{ reg.Fila }}')" class="bg-red-100 text-red-600 hover:bg-red-600 hover:text-white font-bold py-2 px-4 rounded-lg transition-all text-xs">
                                LIBERAR
                            </button>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="3" class="p-12 text-center text-slate-400 font-medium">No hay hermanos registrados aún.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <div class="mt-8 flex justify-center">
            <a href="/reset_total_sistema" 
               onclick="return confirm('¿ESTÁS SEGURO? Se borrarán TODOS los registros del mes.')"
               class="text-red-400 hover:text-red-600 font-bold text-xs uppercase tracking-widest underline decoration-2 underline-offset-4">
               Reiniciar sistema (Cambio de Mes)
            </a>
        </div>
    </div>

    <script>
        async function liberarFila(fila) {
            if(!confirm('¿Liberar la fila ' + fila + '?')) return;
            
            const res = await fetch('/eliminar_registro/' + fila, { method: 'DELETE' });
            if(res.ok) {
                location.reload(); // Recarga la lista automáticamente
            } else {
                alert('Error al liberar');
            }
        }
    </script>
</body>
</html>
