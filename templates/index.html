<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Layout - Santa Cena 2026</title>
    
    <!-- Librerías -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Fuente -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Manrope', sans-serif; margin: 0; padding: 0; overflow: hidden; background-color: #f1f5f9; user-select: none; }
        
        .app-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
            touch-action: none; 
        }

        /* Contenedor del Canvas */
        .scale-container {
            transform-origin: center center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            transition: transform 0.3s ease-out;
        }

        .capture-canvas {
            width: 1280px;
            height: 720px;
            background-color: white;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }
        
        .capture-canvas:active { cursor: grabbing; }

        /* Capa del Mapa (Zoom y Pan) */
        .map-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            transition: transform 1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            transform-origin: 0 0;
            will-change: transform;
        }

        /* Texturas y Estilos Visuales */
        .seat-texture {
            background-image: repeating-linear-gradient(
                0deg, transparent, transparent 4px, rgba(0,0,0,0.03) 4px, rgba(0,0,0,0.03) 6px
            );
        }
        .main-aisle-guide { border-top: 2px dashed rgba(99, 102, 241, 0.2); }

        /* Animación de ruta */
        .path-flow {
            stroke-dasharray: 10;
            animation: dash 30s linear infinite;
        }
        @keyframes dash { to { stroke-dashoffset: -1000; } }

        /* Highlight para sectores activos */
        .sector-active {
            box-shadow: 0 0 0 4px #facc15, 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            z-index: 50 !important;
        }
        
        /* Ocultar scrollbars en el panel */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        {% raw %} 
        const { useState, useEffect, useRef, useMemo } = React;

        /* =========================================
           1. DATA Y CONSTANTES
           ========================================= */
 
        const TableIcon = ({ className }) => (
            <svg className={className || "w-6 h-6"} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 7h18v5H3z" /><path d="M5 12v7" /><path d="M19 12v7" /></svg>
        );

        // Estilos por defecto seguros (evitar errores si activeSector es null)
        const DEFAULT_STYLE = { bg: 'bg-slate-100', border: 'border-slate-300', text: 'text-slate-500', badge: 'bg-slate-400', stroke: '#94a3b8', label: 'General' };

        const getColor = (meson) => {
            switch(meson) {
                case 'norte': return { bg: 'bg-blue-100', border: 'border-blue-500', text: 'text-blue-900', badge: 'bg-blue-600', stroke: '#2563eb', label: 'Mesón Norte' };
                case 'sur': return { bg: 'bg-emerald-100', border: 'border-emerald-500', text: 'text-emerald-900', badge: 'bg-emerald-600', stroke: '#059669', label: 'Mesón Sur' };
                case 'entrada': return { bg: 'bg-amber-100', border: 'border-amber-500', text: 'text-amber-900', badge: 'bg-amber-500', stroke: '#d97706', label: 'Mesón Entrada' };
                default: return DEFAULT_STYLE;
            }
        };

        const ROUTES = {
            1: [[{x: 96, y: 29}, {x: 96, y: 26}, {x: 72, y: 26}], [{x: 91, y: 29}, {x: 91, y: 40}, {x: 72, y: 40}]],
            2: [[{x: 91, y: 48}, {x: 84, y: 52}, {x: 72, y: 52}], [{x: 91, y: 48}, {x: 84, y: 52}, {x: 78, y: 52}, {x: 78, y: 59}]],
            5: [[{x: 96, y: 49}, {x: 96, y: 52}, {x: 71, y: 52}, {x: 71, y: 14}], [{x: 96, y: 49}, {x: 96, y: 61}, {x: 71, y: 61}, {x: 71, y: 52}]],
            3: [[{x: 82, y: 88}, {x: 82, y: 65}]],
            4: [[{x: 75, y: 88}, {x: 72, y: 89}, {x: 72, y: 65}]],
            6: [[{x: 71, y: 88}, {x: 58, y: 88}, {x: 58, y: 65}]],
            8: [[{x: 27, y: 95}, {x: 42, y: 95}, {x: 42, y: 65}]],
            10: [[{x: 27, y: 87}, {x: 28, y: 86}, {x: 28, y: 65}]],
            13: [[{x: 18, y: 87}, {x: 28, y: 87}, {x: 28, y: 65}]],
            14: [[{x: 16, y: 94}, {x: 7, y: 94}, {x: 7, y: 65}]],
            7: [[{x: 5, y: 68}, {x: 5, y: 62}, {x: 42, y: 62}, {x: 42, y: 14}]],
            9: [[{x: 6, y: 74}, {x: 6, y: 62}, {x: 29, y: 62}, {x: 29, y: 14}]],
            11: [[{x: 1, y: 74}, {x: 1, y: 26}, {x: 28, y: 26}], [{x: 1, y: 74}, {x: 1, y: 39}, {x: 28, y: 39}]],
            12: [[{x: 1, y: 78}, {x: 1, y: 53}, {x: 28, y: 53}], [{x: 1, y: 78}, {x: 1, y: 62}, {x: 22, y: 61}, {x: 22, y: 52}]]
        };

        const SECTORS_CONFIG = [
            { id: 1, label: '1', meson: 'norte', zona: 'Frente Der', pos: 'top-[14%] right-[12%]', w: 'w-[13%]', h: 'h-[24%]', cx: 81.5, cy: 26, rangeA: [1, 4], rangeB: [5, 13] },
            { id: 2, label: '2', meson: 'norte', zona: 'Lateral Der', pos: 'top-[44%] right-[12%]', w: 'w-[13%]', h: 'h-[16%]', cx: 81.5, cy: 52, rangeA: [14, 22], rangeB: [23, 28] },
            { id: 3, label: '3', meson: 'entrada', zona: 'Fondo Ext. Der', pos: 'bottom-[15%] right-[2%]', w: 'w-[10%]', h: 'h-[20%]', cx: 93, cy: 75, rangeA: [29, 36], rangeB: [37, 45] },
            { id: 4, label: '4', meson: 'entrada', zona: 'Fondo Der', pos: 'bottom-[15%] right-[14%]', w: 'w-[10%]', h: 'h-[20%]', cx: 81, cy: 75, rangeA: [46, 51], rangeB: [51, 56] },
            { id: 5, label: '5', meson: 'norte', zona: 'Frente Centro-Der', pos: 'top-[14%] right-[27%]', w: 'w-[13%]', h: 'h-[46%]', cx: 66.5, cy: 37, rangeA: [57, 66], rangeB: [68, 73], flexA: 'flex-[18]', flexB: 'flex-[28]' },
            { id: 6, label: '6', meson: 'entrada', zona: 'Fondo C-Der', pos: 'bottom-[15%] right-[27%]', w: 'w-[13%]', h: 'h-[20%]', cx: 66.5, cy: 75, rangeA: [74, 81], rangeB: [82, 90] },
            { id: 7, label: '7', meson: 'sur', zona: 'Frente Centro', pos: 'top-[14%] left-[50%] -translate-x-1/2', w: 'w-[16%]', h: 'h-[37%]', cx: 50, cy: 32.5, rangeA: [91, 100], rangeB: [101, 104] },
            { id: 8, label: '8', meson: 'entrada', zona: 'Fondo Centro', pos: 'bottom-[15%] left-[50%] -translate-x-1/2', w: 'w-[16%]', h: 'h-[20%]', cx: 50, cy: 75, rangeA: [105, 112], rangeB: [113, 121] },
            { id: 9, label: '9', meson: 'sur', zona: 'Frente Centro-Izq', pos: 'top-[14%] left-[27%]', w: 'w-[13%]', h: 'h-[46%]', cx: 33.5, cy: 37, rangeA: [122, 132], rangeB: [132, 138], flexA: 'flex-[18]', flexB: 'flex-[28]' },
            { id: 10, label: '10', meson: 'entrada', zona: 'Fondo C-Izq', pos: 'bottom-[15%] left-[27%]', w: 'w-[13%]', h: 'h-[20%]', cx: 33.5, cy: 75, rangeA: [139, 146], rangeB: [147, 155] },
            { id: 11, label: '11', meson: 'sur', zona: 'Frente Izq', pos: 'top-[14%] left-[12%]', w: 'w-[13%]', h: 'h-[24%]', cx: 18.5, cy: 26, rangeA: [156, 159], rangeB: [160, 168] },
            { id: 12, label: '12', meson: 'sur', zona: 'Lateral Izq', pos: 'top-[44%] left-[12%]', w: 'w-[13%]', h: 'h-[16%]', cx: 18.5, cy: 52, rangeA: [169, 177], rangeB: [178, 182] },
            { id: 13, label: '13', meson: 'entrada', zona: 'Fondo Izq', pos: 'bottom-[15%] left-[14%]', w: 'w-[10%]', h: 'h-[20%]', cx: 19, cy: 75, rangeA: [188, 192], rangeB: [194, 198] },
            { id: 14, label: '14', meson: 'entrada', zona: 'Fondo Ext. Izq', pos: 'bottom-[15%] left-[2%]', w: 'w-[10%]', h: 'h-[20%]', cx: 7, cy: 75, rangeA: [199, 206], rangeB: [207, 215] }
        ];

        /* =========================================
           2. COMPONENTE APP
           ========================================= */

        const App = () => {
            const params = new URLSearchParams(window.location.search);
            const filaDeUrl = params.get('fila');
            const esModoLectura = params.get('readOnly') === 'true';
        
            const [selectedId, setSelectedId] = useState(null); // Usar useState directamente si desestructuraste arriba
            const [trayNumber, setTrayNumber] = useState(filaDeUrl || ''); 
            const [nombreHermano, setNombreHermano] = useState('');
            const [telefono, setTelefono] = useState("");
            const [mostrandoCampoTelefono, setMostrandoCampoTelefono] = useState(false);
        
            // UN SOLO REF
            const containerRef = useRef(null);
        
            // Corregir SECTORS -> SECTORS_CONFIG
            useEffect(() => {
                if (filaDeUrl) {
                    const num = parseInt(filaDeUrl);
                    const sectorEncontrado = SECTORS_CONFIG.find(s => 
                        (num >= s.rangeA[0] && num <= s.rangeA[1]) || 
                        (num >= s.rangeB[0] && num <= s.rangeB[1])
                    );
                    if (sectorEncontrado) setSelectedId(sectorEncontrado.id);
                }
            }, [filaDeUrl]);

    // ... resto del código ...
                    
            // Estados de UI
            const [showControls, setShowControls] = useState(true);
           
            // Estados del Mapa
            const [scale, setScale] = useState(1);
            const [viewTransform, setViewTransform] = useState({ x: 0, y: 0, k: 1 });
            const [isDragging, setIsDragging] = useState(false);
            const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
            const [isAnimating, setIsAnimating] = useState(true);
            
            const containerRef = useRef(null);

            // Efecto para leer la fila desde la URL (ej: app.html?fila=67)
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const filaUrl = params.get('fila');
                if (filaUrl) {
                    setTrayNumber(filaUrl);
                    // El useEffect de activeData ya existente se encargará del resto
                }
            }, []);

            // Busca donde definiste los estados y pega esto:
           const enviarAlBackend = async () => {
                const payload = { 
                    nombre: nombreHermano, 
                    fila: trayNumber, 
                    sector: selectedId,
                    telefono: telefono // Se envía vacío si ya existe en el JSON
                };
            
                try {
                    const response = await fetch('/enviar_asignacion', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();
            
                    if (data.status === 'need_phone') {
                        setMostrandoCampoTelefono(true);
                        alert("Este hermano no está en la base de datos. Por favor, ingresa su teléfono para guardarlo.");
                    } else if (data.status === 'success') {
                        window.open(data.url_whatsapp, '_blank');
                        // Limpiamos todo para el siguiente registro
                        setNombreHermano("");
                        setTrayNumber("");
                        setTelefono("");
                        setMostrandoCampoTelefono(false);
                    } else {
                        alert(data.message);
                    }
                } catch (e) {
                    alert("Error de conexión");
                }
            };
            
            // --- HASTA AQUÍ ---
            
            
            // Lógica de búsqueda
            const activeData = useMemo(() => {
                const num = parseInt(trayNumber);
                if (isNaN(num)) return null;

                for (const sector of SECTORS_CONFIG) {
                    const isSharedExplicit = (sector.id === 5 && num === 67) || (sector.id === 13 && num === 193) || (sector.id === 9 && num === 132); 
                    const inA = (num >= sector.rangeA[0] && num <= sector.rangeA[1]);
                    const inB = (num >= sector.rangeB[0] && num <= sector.rangeB[1]);
                    const inBothRanges = inA && inB;

                    if (inA || inB || isSharedExplicit) {
                        let subLabel = "";
                        let isShared = false;
                        if (inBothRanges || isSharedExplicit) { isShared = true; subLabel = "A y B (Compartido)"; }
                        else if (inA) { subLabel = "Frente (A)"; } 
                        else { subLabel = "Fondo (B)"; }
                        
                        return { ...sector, tray: num, subLabel, isFront: inA || isSharedExplicit, isShared };
                    }
                }
                return null;
            }, [trayNumber]);

            // EFECTO: Búsqueda -> Selección (SIN ZOOM AUTOMÁTICO)
            useEffect(() => {
                if (activeData) {
                    setSelectedId(activeData.id);
                    // IMPORTANTE: Aquí NO llamamos a ninguna función de zoom.
                    // El usuario debe hacer click en "Acercar" si lo desea.
                } else if (trayNumber === '') {
                    // Si borra el número, podemos limpiar la selección o dejarla.
                    // Para que sea "vista inicial", limpiamos si está vacío.
                    setSelectedId(null);
                }
            }, [activeData, trayNumber]);

            const activeSector = SECTORS_CONFIG.find(s => s.id === selectedId);
            const activeStyle = activeSector ? getColor(activeSector.meson) : DEFAULT_STYLE;

            // Escala Responsiva
            useEffect(() => {
                const handleResize = () => {
                    if (containerRef.current) {
                        const windowWidth = window.innerWidth;
                        const windowHeight = window.innerHeight;
                        const targetWidth = 1280;
                        const targetHeight = 720;
                        const scaleW = windowWidth / targetWidth;
                        const scaleH = windowHeight / targetHeight;
                        const newScale = Math.min(scaleW, scaleH) * 0.95;
                        setScale(newScale);
                    }
                };
                window.addEventListener('resize', handleResize);
                handleResize();
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            // Función manual de zoom
            const performZoomToSector = (sector) => {
                if (!sector) return;
                setIsAnimating(true);
                const canvasW = 1280;
                const canvasH = 720;
                const isMobile = window.innerWidth < 768;
                const zoomLevel = isMobile ? 2.8 : (scale < 0.6 ? 2.5 : 1.8);
                const targetX = (sector.cx / 100) * canvasW;
                const targetY = (sector.cy / 100) * canvasH;
                const x = 640 - (targetX * zoomLevel);
                const y = 360 - (targetY * zoomLevel);
                setViewTransform({ x, y, k: zoomLevel });
            };

            // Helpers de interacción
            const handlePointerDown = (e) => {
                if(e.target.closest('.control-panel')) return;
                if (document.activeElement && document.activeElement.tagName === 'INPUT') document.activeElement.blur();
                setIsAnimating(false);
                setIsDragging(true);
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                setDragStart({ x: clientX, y: clientY });
            };

            const handlePointerMove = (e) => {
                if (!isDragging) return;
                e.preventDefault();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const dx = clientX - dragStart.x;
                const dy = clientY - dragStart.y;
                setViewTransform(prev => ({ ...prev, x: prev.x + (dx / scale), y: prev.y + (dy / scale) }));
                setDragStart({ x: clientX, y: clientY });
            };

            const handlePointerUp = () => setIsDragging(false);

            const resetZoom = (e) => {
                e && e.stopPropagation();
                setIsAnimating(true);
                setViewTransform({ x: 0, y: 0, k: 1 });
                // Se ha mantenido la lógica de NO borrar la selección aquí
            };

            // Dibujo de rutas
            const createRoundedPath = (points, width, height, radius = 20) => {
                if (points.length < 2) return "";
                const pxPoints = points.map(p => ({ x: (p.x / 100) * width, y: (p.y / 100) * height }));
                let d = `M ${pxPoints[0].x} ${pxPoints[0].y}`;
                for (let i = 1; i < pxPoints.length - 1; i++) {
                    const p0 = pxPoints[i - 1]; const p1 = pxPoints[i]; const p2 = pxPoints[i + 1];
                    const v1 = { x: p0.x - p1.x, y: p0.y - p1.y }; const len1 = Math.sqrt(v1.x*v1.x + v1.y*v1.y);
                    const v2 = { x: p2.x - p1.x, y: p2.y - p1.y }; const len2 = Math.sqrt(v2.x*v2.x + v2.y*v2.y);
                    const r = Math.min(radius, len1 / 2, len2 / 2);
                    const startX = p1.x + (v1.x / len1) * r; const startY = p1.y + (v1.y / len1) * r;
                    const endX = p1.x + (v2.x / len2) * r; const endY = p1.y + (v2.y / len2) * r;
                    d += ` L ${startX} ${startY} Q ${p1.x} ${p1.y} ${endX} ${endY}`;
                }
                const last = pxPoints[pxPoints.length - 1];
                d += ` L ${last.x} ${last.y}`;
                return d;
            }

            const getPathsData = () => {
                if (!selectedId) return [];
                const rawRoutes = ROUTES[selectedId];
                if (!rawRoutes) return [];
                let paths = Array.isArray(rawRoutes[0]) ? rawRoutes : [rawRoutes];
                return paths.map(pathPoints => createRoundedPath(pathPoints, 1280, 720));
            };

            return (
                <div className="app-container bg-slate-100">
                    
                    {/* --- PANEL DE CONTROL --- */}
                    {/* ---// Solo muestra el panel si NO hay una fila definida en la URL --- */}
                    {showControls && !new URLSearchParams(window.location.search).get('fila') && (
                        <div className="control-panel fixed top-4 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-white/95 backdrop-blur-md p-4 rounded-2xl shadow-2xl border border-slate-200 z-[100] flex flex-col gap-4 transition-all">                            
                            {/* Buscador */}
                            <div className="flex gap-2 items-center">
                                <div className="relative flex-1">
                                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-indigo-600 font-black text-sm">#</span>
                                    <input 
                                        type="number" 
                                        inputMode="numeric"
                                        enterKeyHint="go"
                                        placeholder="Ingrese Fila..." 
                                        className="w-full pl-7 pr-3 py-2 bg-slate-50 border-2 border-slate-200 rounded-xl focus:border-indigo-500 focus:bg-white outline-none text-base font-bold shadow-inner text-slate-700 placeholder-slate-400"
                                        value={trayNumber}
                                        onChange={(e) => setTrayNumber(e.target.value)}
                                        onClick={(e) => e.target.select()}
                                        onKeyDown={(e) => { if (e.key === 'Enter') e.currentTarget.blur(); }}
                                    />
                                </div>
                                <button onClick={resetZoom} className="bg-slate-100 text-slate-600 px-3 py-2 rounded-xl text-xs font-bold hover:bg-slate-200 border border-slate-300 whitespace-nowrap">
                                    Ver Todo
                                </button>
                                <button onClick={() => setShowControls(false)} className="bg-slate-800 text-white px-3 py-2 rounded-xl text-xs font-bold hover:bg-slate-900 whitespace-nowrap">
                                    Ocultar
                                </button>
                            </div>

                            {/* Información del Resultado (Si hay selección) */}
                            {selectedId && (
                                <div className="flex items-stretch gap-3 animate-in fade-in slide-in-from-top-2 duration-300">
                                    <div className={`w-16 h-16 rounded-xl flex items-center justify-center text-2xl font-black shadow-inner transition-colors ${activeStyle.bg} ${activeStyle.text} border-2 ${activeStyle.border}`}>
                                        {selectedId}
                                    </div>
                                    <div className="flex-1 flex flex-col justify-center">
                                        <h3 className="text-sm font-extrabold text-slate-800 uppercase tracking-tight">
                                            {activeData ? `Fila #${activeData.tray}` : `Sector ${selectedId}`}
                                        </h3>
                                        <p className="text-xs text-slate-500 font-medium">
                                            {activeData ? activeData.subLabel : activeSector?.zona}
                                        </p>
                                        <div className="mt-1 flex justify-between items-center">
                                            <div className="inline-flex items-center gap-1.5">
                                                <div className={`w-2 h-2 rounded-full ${activeStyle.badge}`}></div>
                                                <span className={`text-[10px] font-bold uppercase ${activeStyle.text}`}>
                                                    {activeStyle.label}
                                                </span>
                                            </div>
                                            {/* BOTÓN DE ZOOM MANUAL */}
                                            <button 
                                                onClick={() => performZoomToSector(activeSector)}
                                                className="bg-indigo-600 text-white px-2 py-1 rounded-md text-[10px] font-bold shadow-sm hover:bg-indigo-700 flex items-center gap-1"
                                            >
                                                🔍 Acercar
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* Selección Manual */}
                            <div className="border-t border-slate-100 pt-2">
                                <p className="text-[9px] text-slate-400 uppercase font-bold mb-1.5 tracking-wider">Selección Manual</p>
                                <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                                    {SECTORS_CONFIG.sort((a,b) => a.id - b.id).map(s => (
                                        <button
                                            key={s.id}
                                            onClick={(e) => { 
                                                e.stopPropagation(); 
                                                setSelectedId(s.id); 
                                                setTrayNumber(''); 
                                                performZoomToSector(s); // Zoom automático solo en click manual de lista
                                            }}
                                            className={`flex-shrink-0 w-8 h-8 rounded-lg font-black text-xs transition-all border-2
                                                ${selectedId === s.id 
                                                    ? 'bg-indigo-600 text-white border-indigo-800 scale-105 shadow-md' 
                                                    : 'bg-white text-slate-400 border-slate-100 hover:bg-slate-50'}`}
                                        >
                                            {s.id}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            {!esModoLectura ? (
                            // MODO CAPTADOR: Se ve el buscador
                            <div className="p-6 space-y-4 bg-white shadow-sm border-b">
                                <div>
                                    <label className="text-xs font-black text-slate-400 uppercase tracking-widest mb-2 block">
                                        Servidor a Asignar
                                    </label>
                                    <input 
                                        type="text"
                                        value={nombreHermano}
                                        onChange={(e) => setNombreHermano(e.target.value)}
                                        placeholder="Ej: Andres Acevedo"
                                        className="w-full p-4 bg-slate-100 border-2 border-transparent focus:border-blue-500 focus:bg-white rounded-2xl outline-none transition-all font-bold text-slate-700"
                                    />
                                </div>
                                {/* --- INTEGRACIÓN DEL CAMPO DE TELÉFONO --- */}
                                {mostrandoCampoTelefono && (
                                    <div className="animate-in fade-in slide-in-from-top-2 duration-300">
                                        <label className="text-[10px] font-black text-amber-600 uppercase tracking-widest mb-2 block ml-2">
                                            ⚠️ Hermano nuevo - Ingrese Teléfono
                                        </label>
                                        <input 
                                            type="text"
                                            value={telefono}
                                            onChange={(e) => setTelefono(e.target.value)}
                                            placeholder="Ej: 56912345678"
                                            className="w-full p-4 bg-amber-50 border-2 border-amber-400 rounded-2xl outline-none font-bold text-slate-700"
                                            autoFocus
                                        />
                                    </div>
                                )}
                                <button 
                                    onClick={enviarAlBackend}
                                    className="w-full bg-green-600 hover:bg-green-700 text-white font-extrabold p-4 rounded-2xl shadow-lg transition-all active:scale-95"
                                >
                                    REGISTRAR Y ENVIAR
                                </button>
                            </div>
                        ) : (
                            // MODO HERMANO: Se ve la fila asignada en grande
                            <div className="p-6 space-y-2 bg-blue-600 text-white shadow-xl">
                                <p className="text-xs font-black uppercase tracking-widest opacity-80">Tu Ubicación Asignada</p>
                                <h2 className="text-5xl font-black italic">FILA {trayNumber}</h2>
                                <p className="text-sm font-medium opacity-90">Por favor, diríjase al sector resaltado en el mapa.</p>
                            </div>
                        )}
                        </div>
                    )}

                    {!showControls && (
                        <button onClick={() => setShowControls(true)} className="fixed top-4 right-4 z-[100] bg-white text-slate-800 px-4 py-3 rounded-full shadow-xl border border-slate-200 text-sm font-black backdrop-blur-sm flex items-center gap-2 animate-bounce">
                            <span>🔍</span> Buscar
                        </button>
                    )}

                    {/* --- CANVAS --- */}
                    <div className="scale-container" style={{ transform: `scale(${scale})` }} ref={containerRef}>
                        <div 
                            className="capture-canvas"
                            onMouseDown={handlePointerDown}
                            onMouseMove={handlePointerMove}
                            onMouseUp={handlePointerUp}
                            onMouseLeave={handlePointerUp}
                            onTouchStart={handlePointerDown}
                            onTouchMove={handlePointerMove}
                            onTouchEnd={handlePointerUp}
                        >
                            {/* Header flotante */}
                            <div className="absolute top-6 left-8 z-[70] pointer-events-none opacity-80">
                                <h1 className="text-3xl font-black text-slate-200 uppercase tracking-tighter opacity-50 mix-blend-multiply">Plano Santa Cena</h1>
                            </div>

                            {/* MAPA */}
                            <div 
                                className="map-layer" 
                                style={{ 
                                    transform: `translate(${viewTransform.x}px, ${viewTransform.y}px) scale(${viewTransform.k})`,
                                    transition: isAnimating ? 'transform 1s cubic-bezier(0.25, 0.46, 0.45, 0.94)' : 'none'
                                }}
                            >
                                {/* SVG Rutas */}
                                <svg className="absolute inset-0 w-full h-full pointer-events-none z-[55]">
                                    <defs>
                                        <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                                            <path d="M0,0 L0,6 L6,3 z" fill={activeStyle.stroke} />
                                        </marker>
                                        <marker id="startdot" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
                                            <circle cx="3" cy="3" r="2.5" fill={activeStyle.stroke} />
                                        </marker>
                                    </defs>
                                    {getPathsData().map((d, index) => (
                                        <React.Fragment key={index}>
                                            <path d={d} fill="none" stroke="white" strokeWidth="8" strokeLinecap="round" strokeLinejoin="round" className="opacity-80 drop-shadow-sm" />
                                            <path d={d} fill="none" stroke={activeStyle.stroke} strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="8,8" className="path-flow" markerStart="url(#startdot)" markerEnd="url(#arrowhead)" />
                                        </React.Fragment>
                                    ))}
                                </svg>

                                {/* Estructura Base */}
                                <div className="absolute inset-0">
                                    {/* Mesones */}
                                    <div className={`absolute bottom-[15%] left-[2%] z-30 flex flex-col items-center justify-center h-[20%] transition-all duration-500 ${activeSector?.meson === 'sur' ? 'opacity-100 scale-110' : 'opacity-30 grayscale'}`}>
                                        <div className="w-12 h-full bg-emerald-600 rounded-xl shadow-lg border-2 border-white flex items-center justify-center text-white mb-1"><TableIcon className="w-8 h-8" /></div>
                                        <span className="text-[8px] font-black text-emerald-800 bg-white px-2 py-0.5 rounded shadow text-center">SUR</span>
                                    </div>
                                    <div className={`absolute top-[27%] right-[5%] z-30 flex flex-col items-center justify-center h-[25%] transition-all duration-500 ${activeSector?.meson === 'norte' ? 'opacity-100 scale-110' : 'opacity-30 grayscale'}`}>
                                        <div className="w-12 h-full bg-blue-600 rounded-xl shadow-lg border-2 border-white flex items-center justify-center text-white mb-1"><TableIcon className="w-8 h-8" /></div>
                                        <span className="text-[8px] font-black text-blue-800 bg-white px-2 py-0.5 rounded shadow text-center">NORTE</span>
                                    </div>
                                    <div className={`absolute bottom-[6%] left-1/2 -translate-x-1/2 w-[82%] z-30 flex justify-between transition-all duration-500 ${activeSector?.meson === 'entrada' ? 'opacity-100' : 'opacity-30 grayscale'}`}>
                                        <div className="bg-amber-500 text-white rounded-t-xl w-[26%] py-2 flex items-center justify-center shadow-lg border-white border-2"><TableIcon className="w-6 h-6" /></div>
                                        <div className="bg-amber-500 text-white rounded-t-xl w-[32%] py-2 flex items-center justify-center shadow-lg border-white border-2"><TableIcon className="w-6 h-6" /></div>
                                    </div>

                                    {/* Arquitectura */}
                                    <div className="absolute top-0 bottom-0 left-[6%] right-[6%]">
                                        <div className="absolute top-0 left-[15%] right-[15%] h-16 bg-slate-800 rounded-b-[3rem] z-10 border-b-4 border-slate-600 shadow-xl flex items-center justify-center"><span className="text-white/20 font-black text-2xl tracking-[1em] uppercase">Púlpito</span></div>
                                        <div className="absolute top-[52%] left-1/2 -translate-x-1/2 w-[16%] h-[8%] bg-slate-700 rounded-b-xl z-20 border-x-4 border-b-4 border-slate-600 flex flex-col items-center justify-center"><span className="text-[9px] font-black text-white uppercase tracking-widest">Multimedia</span></div>
                                        <div className="absolute top-[64%] left-4 right-4 h-px main-aisle-guide flex items-center justify-center opacity-50"><span className="bg-slate-50 px-2 text-[8px] font-black text-slate-400 uppercase tracking-[0.2em]">Pasillo Principal</span></div>
                                        <div className="absolute bottom-0 left-1/2 -translate-x-1/2 h-16 z-20 opacity-60 flex flex-col justify-end items-center">
                                            <div className="animate-bounce mb-1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" className="text-slate-400"><path d="M12 19V5" /><path d="M5 12l7-7 7 7" /></svg></div>
                                            <span className="text-[9px] font-black text-slate-400 uppercase tracking-widest bg-white/80 px-2 rounded">Acceso Principal</span>
                                        </div>

                                        {/* Sectores */}
                                        {SECTORS_CONFIG.map(s => {
                                            const isSelected = selectedId === s.id;
                                            const st = isSelected ? getColor(s.meson) : DEFAULT_STYLE;
                                            const containerClass = isSelected ? 'opacity-100 z-50 scale-105 sector-active' : (selectedId ? 'opacity-40 z-20 grayscale' : 'opacity-100 z-20');
                                            
                                            const growA = s.flexA || 'flex-1';
                                            const growB = s.flexB || 'flex-1';
                                            const labelPos = (s.id === 5 || s.id === 9) ? "top-[40%] -translate-y-1/2 w-full flex justify-center" : "inset-0 flex flex-col items-center justify-center";

                                            const highlightA = isSelected && activeData && (activeData.isShared || activeData.isFront);
                                            const highlightB = isSelected && activeData && (activeData.isShared || !activeData.isFront);

                                            const minRow = s.rangeA[0];
                                            const maxRow = s.rangeB[1];

                                            return (
                                                <div 
                                                    key={s.id} 
                                                    onClick={(e) => { 
                                                        e.stopPropagation(); 
                                                        if(selectedId !== s.id) {
                                                            setSelectedId(s.id); 
                                                            setTrayNumber(''); 
                                                            performZoomToSector(s); // Click directo en mapa = Zoom
                                                        }
                                                    }}
                                                    className={`absolute ${s.pos} ${s.w} ${s.h} flex flex-col transition-all duration-500 cursor-pointer ${containerClass}`}
                                                >
                                                    <div className={`${growA} rounded-t-lg border-2 seat-texture relative flex items-center justify-center transition-colors duration-300 ${highlightA ? 'bg-indigo-600 border-indigo-400' : `${st.bg} ${st.border}`}`}>
                                                        <span className={`text-[8px] font-bold uppercase opacity-60 ${highlightA ? 'text-white' : s.text}`}>{isSelected ? 'FRENTE' : 'A'}</span>
                                                        {highlightA && <div className="absolute top-1 right-1 w-2 h-2 bg-yellow-400 rounded-full animate-pulse shadow-lg"></div>}
                                                    </div>
                                                    <div className="h-[6%] min-h-[2px] w-full flex items-center justify-center"><div className="w-full h-px bg-slate-300/30"></div></div>
                                                    <div className={`${growB} rounded-b-lg border-2 seat-texture relative flex items-center justify-center transition-colors duration-300 ${highlightB ? 'bg-indigo-600 border-indigo-400' : `${st.bg} ${st.border}`}`}>
                                                        <span className={`text-[8px] font-bold uppercase opacity-60 ${highlightB ? 'text-white' : s.text}`}>{isSelected ? 'FONDO' : 'B'}</span>
                                                        {highlightB && <div className="absolute bottom-1 right-1 w-2 h-2 bg-yellow-400 rounded-full animate-pulse shadow-lg"></div>}
                                                    </div>
                                                    
                                                    {/* ETIQUETA SECTOR + RANGO FILAS */}
                                                    <div className={`absolute pointer-events-none z-[60] ${labelPos}`}>
                                                        <div className={`px-2 py-1.5 rounded-lg border flex flex-col items-center transition-all duration-300 ${isSelected ? 'bg-white shadow-lg border-slate-300 scale-125' : 'bg-white/60 border-slate-200/40 backdrop-blur-[2px]'}`}>
                                                            <span className={`text-xl md:text-2xl font-black leading-none ${s.text}`}>{s.id}</span>
                                                            <span className="text-[8px] md:text-[10px] font-extrabold text-slate-600 leading-none mt-1 whitespace-nowrap tracking-tight">
                                                                Filas {minRow}-{maxRow}
                                                            </span>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div className="absolute bottom-4 right-6 z-40 opacity-40 pointer-events-none">
                            <span className="text-[10px] font-bold text-slate-400 uppercase tracking-tighter">Sistema Santa Cena 2026</span>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
        {% endraw %}
    </script>
</body>
</html>
