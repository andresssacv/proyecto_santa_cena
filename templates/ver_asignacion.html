<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ver Ubicación - Santa Cena 2026</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body { font-family: 'Manrope', sans-serif; margin: 0; padding: 0; overflow: hidden; background-color: #f1f5f9; user-select: none; }

.app-container {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    position: relative;
}

.scale-container {
    transform-origin: center center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
    transition: transform 0.3s ease-out;
}

.capture-canvas {
    width: 1280px;
    height: 720px;
    background-color: white;
    position: relative;
    overflow: hidden;
}

.map-layer {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    transform-origin: 0 0;
    will-change: transform;
}

.seat-texture {
    background-image: repeating-linear-gradient(
        0deg, transparent, transparent 4px, rgba(0,0,0,0.03) 4px, rgba(0,0,0,0.03) 6px
    );
}

.path-flow {
    stroke-dasharray: 10;
    animation: dash 30s linear infinite;
}

@keyframes dash { to { stroke-dashoffset: -1000; } }

.sector-active {
    box-shadow: 0 0 0 4px #facc15, 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    z-index: 50 !important;
}
</style>
</head>

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const TableIcon = ({ className }) => (
<svg className={className || "w-6 h-6"} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 7h18v5H3z" /><path d="M5 12v7" /><path d="M19 12v7" /></svg>
);

const DEFAULT_STYLE = { bg: 'bg-slate-100', border: 'border-slate-300', text: 'text-slate-500', badge: 'bg-slate-400', stroke: '#94a3b8', label: 'General' };

const getColor = (meson) => {
    switch(meson) {
        case 'norte': return { bg: 'bg-blue-100', border: 'border-blue-500', text: 'text-blue-900', badge: 'bg-blue-600', stroke: '#2563eb', label: 'Mesón Norte' };
        case 'sur': return { bg: 'bg-emerald-100', border: 'border-emerald-500', text: 'text-emerald-900', badge: 'bg-emerald-600', stroke: '#059669', label: 'Mesón Sur' };
        case 'entrada': return { bg: 'bg-amber-100', border: 'border-amber-500', text: 'text-amber-900', badge: 'bg-amber-500', stroke: '#d97706', label: 'Mesón Entrada' };
        default: return DEFAULT_STYLE;
    }
};

const ROUTES = {
    1: [[{x: 96, y: 29}, {x: 96, y: 26}, {x: 72, y: 26}]],
    7: [[{x: 5, y: 68}, {x: 5, y: 62}, {x: 42, y: 62}, {x: 42, y: 14}]]
};

const SECTORS_CONFIG = [
    { id: 1, meson: 'norte', cx: 81.5, cy: 26, rangeA: [1, 50], rangeB: [51, 99] },
    { id: 7, meson: 'sur', cx: 50, cy: 32.5, rangeA: [100, 150], rangeB: [151, 200] }
];

const App = () => {

const params = new URLSearchParams(window.location.search);
const filaDeUrl = params.get('fila');

const [trayNumber] = useState(filaDeUrl || '');
const [selectedId, setSelectedId] = useState(null);
const [viewTransform, setViewTransform] = useState({ x: 0, y: 0, k: 1 });

const activeData = useMemo(() => {
    const num = parseInt(trayNumber);
    if (isNaN(num)) return null;

    for (const sector of SECTORS_CONFIG) {
        const inA = num >= sector.rangeA[0] && num <= sector.rangeA[1];
        const inB = num >= sector.rangeB[0] && num <= sector.rangeB[1];
        if (inA || inB) return { ...sector, tray: num };
    }
    return null;
}, [trayNumber]);

useEffect(() => {
    if (activeData) {
        setSelectedId(activeData.id);

        const zoom = window.innerWidth < 768 ? 2.8 : 1.8;
        setViewTransform({
            x: 640 - ((activeData.cx / 100) * 1280 * zoom),
            y: 360 - ((activeData.cy / 100) * 720 * zoom),
            k: zoom
        });
    }
}, [activeData]);

return (
<div className="app-container">

{/* PANEL SUPERIOR */}
<div className="fixed top-4 left-1/2 -translate-x-1/2 bg-blue-600 text-white p-4 rounded-xl shadow-xl z-[100]">
    <p className="text-xs font-black uppercase opacity-80">Tu ubicación asignada</p>
    <h2 className="text-4xl font-black italic">FILA {trayNumber}</h2>

    {activeData && (
        <p className="text-sm mt-1 font-bold">
            🪑 Mesa: {getColor(activeData.meson).label}
        </p>
    )}
</div>

{/* MAPA */}
<div className="scale-container">
    <div className="capture-canvas">
        <div className="map-layer" style={{ transform: `translate(${viewTransform.x}px, ${viewTransform.y}px) scale(${viewTransform.k})` }}>
            
            <svg className="absolute inset-0 w-full h-full pointer-events-none z-[55]">
                {ROUTES[selectedId]?.map((points, i) => (
                    <path key={i} d={`M ${points.map(p => `${(p.x/100)*1280} ${(p.y/100)*720}`).join(' L ')}`} fill="none" stroke="#2563eb" strokeWidth="4" className="path-flow" />
                ))}
            </svg>

            <div className="absolute inset-0 flex justify-center items-center">
                {SECTORS_CONFIG.map(s => {
                    const selected = selectedId === s.id;
                    const st = selected ? getColor(s.meson) : DEFAULT_STYLE;

                    return (
                        <div key={s.id} className={`w-32 h-32 rounded-xl flex items-center justify-center border-2 ${st.bg} ${st.border} ${selected ? 'sector-active' : ''}`}>
                            <span className={`text-xl font-black ${st.text}`}>{s.id}</span>
                        </div>
                    );
                })}
            </div>

        </div>
    </div>
</div>

</div>
);
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
